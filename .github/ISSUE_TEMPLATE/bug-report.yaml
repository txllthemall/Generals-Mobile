name: Android bug report
description: Report a Generals Mobile crash, compatibility problem or control issue
labels: ["Bug", "Triage"]

body:
  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and did not find the same report
          required: true
        - label: I am using legally owned Zero Hour game data
          required: true

  - type: input
    attributes:
      label: Generals Mobile version
      description: APK version code or release tag
      placeholder: v123 / versionCode 123
    validations:
      required: true

  - type: input
    attributes:
      label: Phone and GPU
      placeholder: OnePlus 15, Snapdragon, Adreno 840
    validations:
      required: true

  - type: input
    attributes:
      label: Android and driver
      description: Android/ROM version and stock, Turnip or other Vulkan driver
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Input method
      options:
        - Touch
        - Gamepad
        - Touch and gamepad
        - Not input-related
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start a skirmish...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs and media
      description: Attach the relevant logcat excerpt, screenshots or video. Do not upload game data.
