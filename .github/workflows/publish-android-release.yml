name: Publish Android Release Artifact

permissions:
  contents: write
  actions: read

on:
  # Deliberately narrow: ordinary pushes to main do not build or publish.
  # Updating this manifest is the explicit release action.
  push:
    branches:
      - main
    paths:
      - '.github/android-release.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6

      - name: Read and validate release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/android-release.json
          VERSION_NAME="$(jq -er '.version_name' "$FILE")"
          SOURCE_RUN_ID="$(jq -er '.source_run_id' "$FILE")"
          ARTIFACT_NAME="$(jq -er '.artifact_name' "$FILE")"
          SOURCE_SHA="$(jq -er '.source_sha' "$FILE")"
          NOTES="$(jq -r '.release_notes // ""' "$FILE")"

          [[ "$VERSION_NAME" =~ ^[0-9]+([.][0-9]+)*$ ]] || { echo "::error::invalid version_name"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::invalid source_run_id"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid source_sha"; exit 1; }
          [[ "$ARTIFACT_NAME" == *.apk ]] || { echo "::error::artifact_name must end in .apk"; exit 1; }

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo 'release_notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify source workflow succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.meta.outputs.source_run_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')"
          RUN_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')"
          RUN_CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion')"
          if [ "$RUN_SHA" != "$SOURCE_SHA" ] || [ "$RUN_STATUS" != "completed" ] || [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::source run is not the requested successful build"
            exit 1
          fi

      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.meta.outputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir release/source
          APK="$(find release/source -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "::error::APK missing from downloaded artifact"; exit 1; }
          cp "$APK" "release/Generals-Mobile-v${VERSION_NAME}.apk"
          sha256sum "release/Generals-Mobile-v${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: Generals Mobile v${{ steps.meta.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.meta.outputs.release_notes }}
          files: release/Generals-Mobile-v${{ steps.meta.outputs.version_name }}.apk
          generate_release_notes: true
          make_latest: true
